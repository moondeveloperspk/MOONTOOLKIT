          -webkit-appearance: none;
          appearance: none;
          height: 6px;
          background: #333333;
          border-radius: 999px;
        }
        input[type="range"]::-webkit-slider-thumb{
          -webkit-appearance: none;
          width: 20px;
          height: 20px;
          border-radius: 50%;
          background: #FFFFFF;
          border: 3px solid #000000;
          cursor: pointer;
        }
        input[type="range"]::-moz-range-thumb{
          width: 20px;
          height: 20px;
          border-radius: 50%;
          background: #FFFFFF;
          border: 3px solid #000000;
          cursor: pointer;
        }

        .mc-man details{ border:1px solid #2A2A2A; border-radius:12px; background:#0A0A0A; margin-bottom:8px; overflow:hidden; }
        .mc-man summary{ cursor:pointer; list-style:none; padding:12px 14px; font-weight:800; font-size:14px; color:#FFFFFF; display:flex; justify-content:space-between; align-items:center; }
        .mc-man summary::-webkit-details-marker{ display:none; }
        .mc-man summary::after{ content:"▸"; transition:transform .15s; }
        .mc-man details[open] summary::after{ transform:rotate(90deg); }
        .mc-man[dir="rtl"] summary::after{ content:"◂"; }
        .mc-man[dir="rtl"] details[open] summary::after{ transform:rotate(-90deg); }
        .mc-man bdi{ unicode-bidi:isolate; }
        .mc-man ol,.mc-man ul{ margin:0; padding:0 0 8px; padding-inline-start:34px; padding-inline-end:14px; }
        .mc-man ol{ list-style:decimal; }
        .mc-man ul{ list-style:disc; }
        .mc-man li{ margin-bottom:6px; }
